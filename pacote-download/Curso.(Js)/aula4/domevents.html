<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Events</title>
    <style>
        #area{
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">>What's going on? </div>
    <script>
        var a = window.document.getElementById('area')
        /*
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair) */

        function clicar(){
            
            a.innerText = 'You clicked nigga!!!'
            a.style.background = 'red'
            
            
        }
        function entrar(){
            
            a.innerText = 'you got in'
            a.style.background = 'yellow'
        }

        function sair(){
            a.innerText = 'you got out '
            a.style.background = 'green'
        }
    </script>
</body>
</html>
